# Port 8080, not 80: the image is nginx-unprivileged so the container can run
# as a non-root user, which the cluster requires.
server {
    server_tokens off;

    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Flutter web ships a multi-megabyte main.dart.js; serving it uncompressed
    # dominates first load.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css text/javascript application/javascript
                     application/json application/wasm image/svg+xml
                     application/manifest+json;

    # Content Security Policy. CanvasKit paints to a canvas rather than the DOM,
    # so a hostile Matrix message is not a DOM-XSS vector and this is defence in
    # depth -- except for connect-src, which is load-bearing: the access token
    # and E2EE keys live in IndexedDB, and prepare-web.sh pulls third-party JS
    # (native_imaging) into this origin at build time. connect-src is what stops
    # any of that being posted somewhere else.
    #
    # The policy itself is generated at build time by scripts/gen-csp.py,
    # which hashes Flutter's inline bootstrap script -- its content changes on
    # every build, so a hash committed here would break the next rebuild.
    include /etc/nginx/csp.conf;

    # Never cache the entry point or the service worker. They are how a client
    # discovers a new build; a stale copy pins users to the old one
    # indefinitely, and the worker then keeps serving it offline.
    #
    # nginx only inherits add_header from an outer block when the inner block
    # declares none of its own, so every location that sets Cache-Control must
    # repeat the CSP rather than relying on a server-level one.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
    }

    # The one genuinely version-pathed directory can be cached hard.
    location ~* ^/assets/assets/vodozemac/[^/]+/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Flutter emits STABLE filenames (main.dart.js, canvaskit.wasm, assets/...),
    # not content-addressed ones, so these must stay revalidatable: "immutable"
    # would pin clients to a cached build for the whole max-age even on a hard
    # reload, including past a security fix. One day, then revalidate.
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|json)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri =404;
    }

    # Routing is hash-based today, so this fallback is not load-bearing; it is
    # here so switching Flutter to path URLs does not silently start 404ing
    # on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Probe target that does not pull the whole app shell.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
